[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fl_dermamnist"
version = "0.1.0"
description = "Federated learning on DermaMNIST under statistical and system heterogeneity (FedAvg / FedProx / FedNova)."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt (the reproducible env).
# Install for development with:  pip install -e .

[tool.setuptools.packages.find]
include = ["fl_dermamnist*"]
