dataset:
  name: dermamnist
  size: 64
  source: npz
  npz_path: ../dermamnist_64.npz
model:
  name: big_cnn
  in_channels: 3
  num_classes: 7
  pretrained: false
federation:
  num_clients: 10
  num_rounds: 150
  local_epochs: 20
  fraction_fit: 0.5
  fraction_evaluate: 1.0
  track_local_drift: true
training:
  lr: 0.02
  momentum: 0.9
  batch_size: 32
  weight_decay: 0.0
loss:
  type: ce
  focal_gamma: 2.0
  weight_strategy: none
augmentation:
  use_weighted_sampler: false
client_objective:
  proximal_mu: 0.0
partition:
  strategy: mixed_type
  specialist_dominance: 0.7
  hospital_common_share: 0.9
  min_samples_per_client: 10
misc:
  seed: 2024
  device: cuda
  save_dir: results/thesis
  resolved_save_dir: results/thesis/fedavg_E20_s2024
_config_stem: fedavg
